<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Video Generator — Gallery</title>
<script>
/* Icon helper for markup built in JS: ico('trash') -> an <svg><use>. */
function ico(n,cls){return '<svg class="ico'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}

/* Applied before the first paint: deciding the theme later means every load
   flashes the wrong palette. Falls back to the OS preference. */
try{var _t=localStorage.getItem('phos_theme');
 if(!_t)_t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
 if(_t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}
/* Inside the shell the parent owns the choice and pushes it down. */
window.addEventListener('message',function(e){
 if(e.data&&e.data.type==='set-theme'){
  if(e.data.theme==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');}});
</script>
<style>
  /* ═══════════ DESIGN TOKENS — Dynamic Video Generator Studio ═══════════ */
  :root {
  /* Type scale. Before this there were nine sizes drifting between 9px and
     13px with no relationship to each other; the floor is 10px because
     uppercase micro-labels stop being legible below it on a laptop panel. */
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px;
  --fs-xl:18px; --fs-2xl:21px; --fs-3xl:24px; --fs-4xl:32px;

  /* Ink is the text colour the theme paints with. Every neutral overlay
     derives from it, so a light theme only has to flip this one value —
     a hardcoded white veil is invisible on a light surface. */
  --ink-rgb: 255,255,255;
  --sunk: #0e071e;   /* recessed surfaces: inputs, tracks, wells */
  --well-rgb: 3,1,12;  /* deep wells behind media and code */

    --bg: #060312; --fg: #f2edff;
    --fg2: rgba(var(--ink-rgb),.62); --fg3: rgba(var(--ink-rgb),.38);
    --line: rgba(var(--ink-rgb),.09); --line2: rgba(var(--ink-rgb),.17);
    --accent: #ff3dae; --accent2: #2ee6ff; --accent3: #ffd84d;
    --violet: #9d6bff; --green: #3dffb0; --red: #ff6b81;
    --panel: rgba(14,7,30,.66); --border: rgba(var(--ink-rgb),.09);
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
    --r-sm: 9px; --r-md: 13px; --r-lg: 18px;
    --grad-create: linear-gradient(115deg, var(--accent), var(--violet) 55%, var(--accent2));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(255,61,174,.35); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(var(--ink-rgb),.12); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--ink-rgb),.22); }

  body::before {
    content: ''; position: fixed; inset: -30vmax; pointer-events: none; z-index: 0;
    background:
      radial-gradient(38vmax 38vmax at 12% 8%,  rgba(255,61,174,.15), transparent 62%),
      radial-gradient(44vmax 44vmax at 88% 90%, rgba(46,230,255,.12), transparent 60%),
      radial-gradient(30vmax 30vmax at 78% 6%,  rgba(157,107,255,.11), transparent 65%);
    filter: blur(50px) saturate(120%);
    animation: aurora 26s ease-in-out infinite alternate;
  }
  @keyframes aurora { 100% { transform: translate3d(4vw,-3vh,0) scale(1.12); } }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(rgba(var(--ink-rgb),.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--ink-rgb),.022) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(130% 100% at 50% 0%, #000 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(130% 100% at 50% 0%, #000 40%, transparent 100%);
  }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  @media (max-width: 900px) {
    .lockup h1 { font-size: var(--fs-xl); letter-spacing: .16em; }
    /* health lights: anchored at the bottom, under the content (.wrap z1 stacking-context trap) */
    #healthbar { top: auto !important; bottom: 10px !important; right: 10px !important; z-index: 0 !important; }
  }

  /* ═══════════ HEADER ═══════════ */
  .studio-top {
    position: relative; z-index: 1;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    max-width: 1440px; margin: 0 auto;
    padding: 20px 24px 12px;
  }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .orb {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: conic-gradient(from 210deg, var(--accent), var(--violet), var(--accent2), var(--accent3), var(--accent));
    filter: saturate(130%);
    box-shadow: 0 0 26px rgba(255,61,174,.45), inset 0 0 14px rgba(3,1,10,.6);
    animation: orbspin 14s linear infinite;
  }
  @keyframes orbspin { to { transform: rotate(360deg); } }
  .lockup h1 {
    margin: 0; font-size: var(--fs-2xl); font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--violet), var(--accent2), var(--accent3), var(--accent));
    background-size: 320% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 9s linear infinite;
  }
  @keyframes shimmer { to { background-position: 320% 50%; } }
  .lockup .sub { margin-top: 2px; font-size: var(--fs-2xs); letter-spacing: .3em; text-transform: uppercase;
    color: var(--fg3); font-family: var(--font-mono); }
  .pipeline { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono);
    font-size: var(--fs-2xs); letter-spacing: .22em; text-transform: uppercase; color: var(--fg3); padding-bottom: 4px; }
  .pipeline b { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .pipeline b::before { content: ''; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 8px currentColor; background: currentColor; }
  .pipeline .p-set { color: var(--accent2); }
  .pipeline .p-cre { color: var(--accent); }
  .pipeline .p-out { color: var(--accent3); }
  .pipeline i { font-style: normal; opacity: .5; }

  .wrap { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 4px 24px 100px; }

  /* ═══════════ SOURCE / CONTROL CARD ═══════════ */
  .controls {
    position: relative;
    background: linear-gradient(180deg, rgba(var(--ink-rgb),.045), rgba(var(--ink-rgb),.012)) padding-box, var(--panel);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 16px; margin-bottom: 16px;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.7);
    animation: rise .5s cubic-bezier(.22,.9,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .controls::before {
    content: ''; position: absolute; inset: 0 auto auto 0; height: 2px; width: 100%;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    background: linear-gradient(90deg, transparent, var(--accent2) 30%, var(--accent2) 70%, transparent);
    opacity: .55;
  }
  .card-h { display: flex; align-items: center; gap: 12px; margin: -2px 0 12px; padding-bottom: 12px;
    border-bottom: 1px solid var(--line); }
  .card-h h2 { margin: 0; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
    color: var(--fg); flex: 1 1 auto; min-width: 0; }
  .card-h h2 small { display: block; margin-top: 2px; font-size: var(--fs-2xs); font-weight: 400;
    letter-spacing: .06em; text-transform: none; color: var(--fg3); }
  .stepn { flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700;
    color: var(--accent2);
    background: rgba(46,230,255,.12);
    border: 1px solid rgba(46,230,255,.38);
    box-shadow: 0 0 14px rgba(46,230,255,.22); }

  label { display: block; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--fg2); margin-bottom: 4px; }
  input[type=url] {
    width: 100%; background: rgba(var(--well-rgb),.5);
    border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--fg);
    font-family: var(--font-mono); font-size: var(--fs-md); padding: 8px 12px; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  input[type=url]:hover { border-color: var(--line2); }
  input[type=url]:focus { border-color: rgba(46,230,255,.65);
    box-shadow: 0 0 0 3px rgba(46,230,255,.14), 0 0 22px rgba(46,230,255,.1); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .chip {
    font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em;
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
    background: transparent; border: 1px solid var(--line); color: var(--fg2);
    transition: all .18s;
  }
  .chip:hover { color: var(--fg); border-color: var(--line2); transform: translateY(-1px); }
  .chip.active { background: linear-gradient(115deg, rgba(46,230,255,.16), rgba(157,107,255,.14));
    border-color: rgba(46,230,255,.45); color: var(--accent2); font-weight: 700;
    box-shadow: 0 0 14px rgba(46,230,255,.18); }
  .btn {
    font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 16px; border-radius: 999px; cursor: pointer; border: none;
    color: #0d0418; background: var(--grad-create); background-size: 220% 100%;
    box-shadow: 0 6px 24px -8px rgba(255,61,174,.55);
    transition: background-position .45s, box-shadow .25s, transform .14s;
  }
  .btn:hover { background-position: 100% 0; transform: translateY(-1px);
    box-shadow: 0 8px 30px -8px rgba(46,230,255,.55); }
  .toolbar .spacer { flex: 1 1 auto; }
  .auto { display: flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--fg2); cursor: pointer; }
  .auto input { accent-color: var(--accent2); }

  .meta-line { font-size: var(--fs-xs); color: var(--fg3); margin-top: 8px; letter-spacing: .04em; font-family: var(--font-mono); }

  /* "public link to share" banner (trycloudflare URL via Firebase RTDB) */
  .share-bar {
    display: none; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px; padding: 12px 16px;
    background: linear-gradient(115deg, rgba(255,61,174,.08), rgba(46,230,255,.08));
    border: 1px solid rgba(46,230,255,.32); border-radius: var(--r-lg);
    font-size: var(--fs-sm); box-shadow: 0 0 30px rgba(46,230,255,.1);
    animation: rise .4s ease both;
  }
  .share-bar.show { display: flex; }
  .share-bar .share-label { color: var(--fg2); letter-spacing: .04em; }
  .share-bar a.share-link { color: var(--accent2); text-decoration: none;
    word-break: break-all; flex: 1 1 auto; min-width: 200px; font-family: var(--font-mono); font-size: var(--fs-xs); }
  .share-bar a.share-link:hover { text-decoration: underline; }
  .share-bar .share-copy {
    font-family: var(--font-ui); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    background: rgba(46,230,255,.12); border: 1px solid rgba(46,230,255,.4); color: var(--accent2);
    transition: background .18s;
  }
  .share-bar .share-copy:hover { background: rgba(46,230,255,.24); }
  .share-bar .share-copy.copied { background: rgba(61,255,176,.18); border-color: rgba(61,255,176,.5); color: #8dffcf; }
  .share-bar .share-dismiss { background: transparent; border: 0; color: var(--fg3);
    cursor: pointer; font-size: var(--fs-lg); padding: 0 4px; }
  .share-bar .share-dismiss:hover { color: var(--fg); }

  /* ═══════════ LIVE MONITOR (render in progress) ═══════════ */
  .monitor { margin-bottom: 16px; display: none; }
  .monitor.show { display: block; animation: rise .4s ease both; }
  .mon-card {
    position: relative;
    background: linear-gradient(180deg, rgba(var(--ink-rgb),.045), rgba(var(--ink-rgb),.012)) padding-box, var(--panel);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 16px 16px; box-shadow: 0 0 40px rgba(46,230,255,.08);
  }
  .mon-card::before {
    content: ''; position: absolute; inset: 0 auto auto 0; height: 2px; width: 100%;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    background: linear-gradient(90deg, transparent, var(--accent3) 30%, var(--accent3) 70%, transparent);
    opacity: .55;
  }
  .mon-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .mon-live { width: 9px; height: 9px; border-radius: 50%; background: var(--accent2);
    box-shadow: 0 0 10px var(--accent2); animation: pulse 1.1s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .mon-title { font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent2); }
  .mon-name { font-size: var(--fs-sm); color: var(--fg); word-break: break-all; flex: 1 1 200px; }
  .mon-time { font-size: var(--fs-2xl); font-weight: 700; color: var(--accent3); font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .mon-phase { font-size: var(--fs-xs); color: var(--fg2); }
  .mon-bar { height: 7px; border-radius: 5px; background: rgba(var(--ink-rgb),.09); margin-top: 8px; overflow: hidden; }
  .mon-bar > i { display: block; height: 100%; background: var(--grad-create);
    width: 0%; transition: width .5s; }
  .mon-queue { margin-top: 12px; font-size: var(--fs-xs); }
  .mon-queue .qhead { color: var(--accent); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; font-size: var(--fs-2xs); }
  .mon-queue ol { margin: 4px 0 0; padding-left: 20px; color: var(--fg2); }
  .mon-queue li { margin: 4px 0; word-break: break-all; display: flex; align-items: center; gap: 8px; }
  .mon-queue li .qname { flex: 1 1 auto; }
  .mon-idle { font-size: var(--fs-sm); color: var(--fg3); }
  .mon-cancel { font-family: var(--font-ui); font-size: var(--fs-2xs); letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    background: rgba(255,107,129,.09); border: 1px solid rgba(255,107,129,.4); color: var(--red); transition: all .15s; }
  .mon-cancel:hover { background: rgba(255,107,129,.22); }
  .mon-cancel.stop { margin-left: auto; }

  /* ═══════════ RUSH GRID ═══════════ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  /* at most 3 rushes per row on wide screens: bigger cards, readable actions */
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: linear-gradient(180deg, rgba(var(--ink-rgb),.04), rgba(var(--ink-rgb),.01)) padding-box, var(--panel);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: var(--r-lg); overflow: hidden;
    box-shadow: 0 16px 40px -22px rgba(0,0,0,.7);
    transition: border-color .2s, box-shadow .2s, transform .18s;
    display: flex; flex-direction: column;
    animation: rise .4s ease both;
  }
  .card:hover { border-color: rgba(255,61,174,.35); transform: translateY(-3px);
    box-shadow: 0 18px 50px -18px rgba(255,61,174,.35); }
  .card video, .card img { width: 100%; display: block; background: #000; aspect-ratio: 16/9; object-fit: contain; }
  .media-holder { position: relative; overflow: hidden; width: 100%; aspect-ratio: 16/9; background: #000; color: var(--on-media);
    display: flex; align-items: center; justify-content: center; }
  .media-holder video { aspect-ratio: 16/9; }
  .media-holder .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 0; }
  .media-holder .loadvid { position: relative; z-index: 1; }
  .loadvid {
    font-family: var(--font-ui); font-size: var(--fs-sm); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 12px 16px; border-radius: 999px; cursor: pointer;
    background: var(--grad-create); background-size: 220% 100%;
    color: #0d0418; border: none;
    box-shadow: 0 8px 26px -8px rgba(255,61,174,.6);
    transition: background-position .45s, transform .14s, box-shadow .25s;
  }
  .loadvid:hover { background-position: 100% 0; transform: scale(1.04);
    box-shadow: 0 10px 32px -8px rgba(46,230,255,.6); }
  .loadvid-progress {
    background: rgba(var(--well-rgb),.7); color: var(--accent2); cursor: default;
    border: 1px solid rgba(46,230,255,.3); box-shadow: none; font-family: var(--font-mono);
    text-transform: none; letter-spacing: .02em; font-weight: 600;
  }
  .vid-err {
    padding: 12px; font-size: var(--fs-xs); color: var(--red); text-align: center;
    background: rgba(255,107,129,.07); width: 100%; word-break: break-word;
  }
  .card .body { padding: 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card .name { font-size: var(--fs-sm); word-break: break-all; color: var(--fg); font-family: var(--font-mono); }
  .card .facts { font-size: var(--fs-2xs); color: var(--fg3); display: flex; flex-wrap: wrap; gap: 4px;
    letter-spacing: .03em; font-family: var(--font-mono); align-items: center; }
  .card .facts .badge { background: rgba(255,216,77,.1); color: var(--accent3); padding: 2px 8px; border-radius: 999px; }
  .facts .mbadge { background: rgba(46,230,255,.1); color: var(--accent2); padding: 2px 8px; border-radius: 999px; }
  .facts .mbadge.lora { background: rgba(255,61,174,.12); color: var(--accent); }
  .card .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .card .actions button, .card .actions a {
    flex: 1 1 calc(33.3% - 7px); min-width: 86px; text-align: center; text-decoration: none;
    font-family: var(--font-ui); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 4px; border-radius: 999px; cursor: pointer;
    background: rgba(46,230,255,.07); border: 1px solid rgba(46,230,255,.28); color: var(--accent2);
    transition: all .15s;
  }
  .card .actions button:hover, .card .actions a:hover { background: rgba(46,230,255,.17); transform: translateY(-1px); }
  .card .actions .copied { background: var(--accent2) !important; color: #062030 !important; }
  .actions button.cmp-on { background: var(--accent2); color: #062030; border-color: var(--accent2); }

  .prompt-wrap { margin-top: 2px; }
  .prompt-toggle {
    width: 100%; text-align: left; font-family: var(--font-ui);
    font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
    background: rgba(255,216,77,.07); border: 1px solid rgba(255,216,77,.3);
    color: var(--accent3); transition: all .15s;
  }
  .prompt-toggle:hover { background: rgba(255,216,77,.15); }
  .prompt-panel { display: none; margin-top: 8px; }
  .prompt-panel.show { display: block; animation: rise .25s ease both; }
  .prompt-text {
    font-size: var(--fs-xs); line-height: 1.55; color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
    max-height: 180px; overflow: auto;
    background: rgba(var(--well-rgb),.5); padding: 8px 12px; border-radius: var(--r-sm);
    border: 1px solid var(--line); font-family: var(--font-mono);
  }
  .prompt-meta { font-size: var(--fs-2xs); color: var(--fg3); margin-top: 4px; letter-spacing: .04em; font-family: var(--font-mono); }
  .prompt-copy {
    margin-top: 8px; width: 100%; font-family: var(--font-ui);
    font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 4px; border-radius: 999px; cursor: pointer;
    background: rgba(46,230,255,.07); border: 1px solid rgba(46,230,255,.28);
    color: var(--accent2); transition: all .15s;
  }
  .prompt-copy:hover { background: rgba(46,230,255,.17); }
  .prompt-copy.copied { background: var(--accent2); color: #062030; }

  .status {
    margin: 16px 0; padding: 12px 16px; border-radius: var(--r-md); font-size: var(--fs-sm);
    font-family: var(--font-mono); border: 1px solid transparent; display: none;
    white-space: pre-wrap; line-height: 1.55;
  }
  .status.show { display: block; animation: rise .3s ease both; }
  .status.ok   { border-color: rgba(61,255,176,.45); background: rgba(61,255,176,.07); color: #8dffcf; }
  .status.err  { border-color: rgba(255,107,129,.5);  background: rgba(255,107,129,.07); color: var(--red); }
  .status.wait { border-color: rgba(255,216,77,.4);   background: rgba(255,216,77,.05);  color: var(--accent3); }
  .empty { text-align: center; color: var(--fg3); padding: 60px 0; font-size: var(--fs-md); }

  .cap-result { margin-top: 8px; padding: 8px 8px; background: rgba(46,230,255,.06);
    border: 1px solid rgba(46,230,255,.3); border-radius: var(--r-sm); font-size: var(--fs-xs);
    line-height: 1.5; color: #d4f2ff; display: none; }
  .cap-result.show { display: block; }
  .cap-result .cap-copy { margin-top: 4px; font-size: var(--fs-2xs); padding: 2px 8px; }

  /* ═══════════ COMPARAISON A/B (visionnage de dailies) ═══════════ */
  .cmpbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; display: none;
    gap: 8px; align-items: center;
    background: rgba(var(--well-rgb),.92);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--line2);
    border-radius: 999px; padding: 8px 16px;
    box-shadow: 0 18px 50px -12px rgba(0,0,0,.8); max-width: 92vw; font-size: var(--fs-xs); }
  .cmpbar.show { display: flex; animation: rise .3s ease both; }
  .cmpbar .slot { font-size: var(--fs-2xs); color: var(--fg2); max-width: 160px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); }
  .cmpbar button { font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: 800; letter-spacing: .05em;
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
    background: var(--grad-create); background-size: 220% 100%; color: #0d0418; border: 0;
    transition: background-position .45s, transform .14s; }
  .cmpbar button:hover { background-position: 100% 0; transform: translateY(-1px); }
  .cmpbar button:disabled { opacity: .4; cursor: default; transform: none; }
  .cmpbar button.ghost { background: transparent; color: var(--accent2); border: 1px solid rgba(46,230,255,.4); }
  .cmpmodal { position: fixed; inset: 0; z-index: 90; background: rgba(3,1,10,.94); color: var(--on-media);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; flex-direction: column; padding: 20px; gap: 12px; }
  .cmpmodal.show { display: flex; }
  .cmpmodal .pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  @media (max-width: 720px) { .cmpmodal .pair { grid-template-columns: 1fr; } }
  .cmpmodal video { width: 100%; height: 100%; object-fit: contain; background: #000;
    border-radius: var(--r-md); border: 1px solid var(--line); }
  .cmpmodal .bar { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .cmpmodal .bar button { font-family: var(--font-ui); font-size: var(--fs-sm); font-weight: 800; padding: 8px 16px;
    border-radius: 999px; cursor: pointer; background: var(--grad-create); background-size: 220% 100%;
    color: #0d0418; border: 0; transition: background-position .45s; }
  .cmpmodal .bar button:hover { background-position: 100% 0; }
  .cmpmodal .bar button.ghost { background: transparent; color: var(--fg); border: 1px solid rgba(var(--ink-rgb),.3); }

/* A checkbox is not a text field. The `width:100%` rules above target inputs
   you type into; applied to a checkbox they stretch it across the column and
   squeeze its own label into a sliver. Declared last so source order wins. */
input[type=checkbox],input[type=radio]{width:auto!important;flex:none;accent-color:var(--accent)}

/* ── Light theme ───────────────────────────────────────────────────────────
   Only the palette flips. Every rule above already paints with these tokens,
   so not one layout or component rule is duplicated here. Accents are
   darkened: the same hue that reads on near-black is illegible on near-white. */
:root[data-theme="light"]{
  --well-rgb: 236,230,248;
  --ink-rgb: 20,10,34;
  --sunk:#f4eef8; --bg:#faf6fd;
  --fg:#170d26; --fg2:rgba(23,13,38,.68); --fg3:rgba(23,13,38,.45);
  --line:rgba(20,10,34,.12); --line2:rgba(20,10,34,.2);
  --accent:#c2007a; --accent2:#0479a8; --accent3:#a06f00;
  --violet:#6d4bd8; --green:#0a8f63; --red:#d61f3d;
  --panel:#ffffff; --border:rgba(20,10,34,.13);
  color-scheme:light;
}

/* WCAG 2.2 AA (2.5.8) pointer targets: 24x24 CSS px floor. Declared last so a
   dense component cannot shrink a control below it. Measured offenders before
   this: rail toggle 24x22, volume slider 54x16, close buttons 23x20,
   Top-10 links 172x14, "clear history" 149x20. */
:root{--target-min:24px;
  /* Ink for grounds that stay dark in BOTH themes (a scrim over a video):
     --fg flips to near-black on the light page, so it cannot be used here. */
  --on-media:#f4f1ff}
button,select,summary,[role=button],textarea,
input:not([type=checkbox]):not([type=radio]){min-height:var(--target-min)}
button,select,summary,[role=button]{min-width:var(--target-min)}
label:has(input[type=checkbox]),label:has(input[type=radio]){min-height:var(--target-min)}
.t10 .t10n{min-height:var(--target-min);display:flex;align-items:center}

/* WCAG 2.4.7. Declared last on purpose: this rule already existed near the top
   of the sheet, and six later `outline:none` rules at equal specificity beat
   it, so keyboard focus computed outline-style:none on every control. */
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}

/* One icon vocabulary: 24x24 stroke geometry, currentColor, 1.8 weight — the
   same drawing the nav tabs already used. Emoji were baked by the platform
   font: they ignored the theme, shifted metrics between machines and could
   not take a stroke weight. Reaction pickers and the favicon stay emoji. */
.ico{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;fill:none;
 stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-lg{width:1.25em;height:1.25em}
button>.ico:first-child:not(:only-child),summary>.ico:first-child{margin-right:.42em}

/* Interaction states, declared once for every control. Pressed and disabled
   were missing on most classes: a control that looks pressable and neither
   acknowledges the press nor shows it is unavailable reads as broken.
   Elevation and opacity only — nothing here changes layout bounds. */
button:not(:disabled):not([aria-busy="true"]):active,
.chip:not(:disabled):active,.plrow:active,.tab:active{transform:translateY(1px);filter:brightness(.94)}
button:disabled,button[disabled],[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:saturate(.35)}
button:disabled:hover,button[disabled]:hover{border-color:var(--border);transform:none;filter:saturate(.35)}
[aria-busy="true"]{cursor:progress;position:relative;color:transparent!important}
[aria-busy="true"]>*{visibility:hidden}
[aria-busy="true"]::after{content:'';position:absolute;inset:0;margin:auto;width:14px;height:14px;
 border:2px solid rgba(var(--ink-rgb),.28);border-top-color:var(--accent2);border-radius:50%;
 animation:btnspin .7s linear infinite}
@keyframes btnspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
 button:active,.chip:active,.plrow:active,.tab:active{transform:none}
 [aria-busy="true"]::after{animation:none;border-top-color:var(--accent2);opacity:.7}
}
</style>

        // injected by the proxy (window.FIREBASE_DB); empty = no discovery.
        if(!window.FIREBASE_DB) return;
        fetch(window.FIREBASE_DB + '/tunnel/url.json')
          .then(function(r){ return r.json(); })
          .then(function(url){
            if (url && typeof url === 'string' && url.startsWith('https://')) {
              ep.value = url;
              ep.dispatchEvent(new Event('change'));
              showShareBar(url);
              console.log('[Firebase] endpoint auto-discovered:', url);
            }
          })
          .catch(function(e){ console.warn('[Firebase] auto-discovery failed:', e); });
      })();
      </script>
    <div class="toolbar">
      <button class="chip active" data-filter="video"><svg class="ico" aria-hidden="true"><use href="#i-clapper"/></svg> Videos</button>
      <button class="chip" data-filter="image"><svg class="ico" aria-hidden="true"><use href="#i-image"/></svg> Images</button>
      <button class="chip" data-filter="all">✦ All</button>
      <span class="spacer"></span>
      <label class="auto"><input type="checkbox" id="autorefresh"> auto 30s</label>
      <button class="btn" id="refresh"><svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg> Refresh</button>
    </div>
    <div class="meta-line" id="meta">—</div>
  </div>

  <div id="shareBar" class="share-bar">
    <span class="share-label">Public link to share:</span>
    <a id="shareLink" class="share-link" href="#" target="_blank" rel="noopener"></a>
    <button id="shareCopy" class="share-copy" type="button">copy</button>
    <button id="shareDismiss" class="share-dismiss" type="button" title="hide">✕</button>
  </div>

  <div id="monitor" class="monitor"></div>

  <div id="status" class="status"></div>
  <div class="grid" id="grid"></div>
  <div class="cmpbar" id="cmpbar">
    <span>⚖ A/B:</span>
    <span class="slot" id="cmpSlot0">—</span>
    <span class="slot" id="cmpSlot1">—</span>
    <button id="cmpGo" disabled>▶ Lire en sync</button>
    <button class="ghost" id="cmpClear">✕ Clear</button>
  </div>
  <div class="cmpmodal" id="cmpmodal">
    <div class="pair"><video id="cmpV0" controls></video><video id="cmpV1" controls></video></div>
    <div class="bar">
      <button id="cmpSync">⏮ Sync &amp; play</button>
      <button class="ghost" id="cmpClose">✕ Close</button>
    </div>
  </div>
  <div class="empty" id="empty" style="display:none;">No clip matches this filter.</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const els = {
    endpoint: $('endpoint'),
    grid: $('grid'),
    status: $('status'),
    meta: $('meta'),
    empty: $('empty'),
    refresh: $('refresh'),
    autorefresh: $('autorefresh'),
    monitor: $('monitor'),
  };

  let filter = 'video';
  let lastOutputs = [];

  function base() { return els.endpoint.value.replace(/\/+$/, ''); }
  // Resilient storage: inside a sandboxed iframe without allow-same-origin
  // (host-html), localStorage/sessionStorage throw SecurityError -> safe wrappers.
  const SS = { get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}}, sget(k){try{return sessionStorage.getItem(k)}catch(_){return null}}, sset(k,v){try{sessionStorage.setItem(k,v)}catch(_){}} };
  // Volume shared with the parent dashboard (localStorage + live postMessage).
  let GVOL = parseFloat(SS.get('phos_volume') || '0.35'); if (isNaN(GVOL)) GVOL = 0.35;
  window.addEventListener('message', e => { if (e.data && e.data.type === 'set-volume') { GVOL = +e.data.vol; document.querySelectorAll('video').forEach(v => v.volume = GVOL); } });
  function publicURL(entry) { return base() + entry.url; }

  // ---------- Bandeau "lien public" (Firebase / /tunnel/url) ----------
  // Show the trycloudflare URL with a copy button. The dismissal is stored in
  // sessionStorage so the banner does not flash again on every reload.
  function showShareBar(url) {
    if (!url || typeof url !== 'string') return;
    if (SS.sget('phos_share_dismissed') === '1') return;
    var bar = document.getElementById('shareBar');
    var link = document.getElementById('shareLink');
    var copy = document.getElementById('shareCopy');
    var dis = document.getElementById('shareDismiss');
    if (!bar || !link || !copy || !dis) return;
    link.href = url;
    link.textContent = url;
    bar.classList.add('show');
    copy.onclick = function() {
      navigator.clipboard.writeText(url).then(function() {
        copy.textContent = '✓ copied';
        copy.classList.add('copied');
        setTimeout(function(){ copy.textContent = 'copy'; copy.classList.remove('copied'); }, 1500);
      }).catch(function(){ /* clipboard unavailable */ });
    };
    dis.onclick = function() {
      bar.classList.remove('show');
      SS.sset('phos_share_dismissed', '1');
    };
  }

  function setStatus(msg, kind) {
    els.status.textContent = msg;
    els.status.className = 'status show ' + (kind || '');
  }
  function clearStatus() { els.status.className = 'status'; }

  // ---------- filters ----------
  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      filter = c.dataset.filter;
      render();
    });
  });

  // ---------- copy ----------
  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      // fallback for file:// where Clipboard API may be blocked
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    if (btn) {
      const old = btn.textContent;
      btn.textContent = '✓ copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1400);
    }
  }

  // ---------- sidecar: prompt + params attached to a media file ----------
  const sidecarCache = {};
  async function fetchSidecar(path) {
    if (sidecarCache[path]) return sidecarCache[path];
    const url = base() + '/sidecar?path=' + encodeURIComponent(path);
    const r = await fetch(url, { headers: { 'ngrok-skip-browser-warning': '1' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const params = data.params || data;   // the sidecar wraps the params
    sidecarCache[path] = params;
    return params;
  }

  function attachPromptPanel(body, entry) {
    const wrap = document.createElement('div');
    wrap.className = 'prompt-wrap';
    const tgl = document.createElement('button');
    tgl.className = 'prompt-toggle';
    tgl.textContent = 'Prompt';
    const panel = document.createElement('div');
    panel.className = 'prompt-panel';
    let loaded = false;
    tgl.addEventListener('click', async () => {
      const open = panel.classList.toggle('show');
      if (!open || loaded) return;
      panel.textContent = 'loading…';
      try {
        const p = await fetchSidecar(entry.path);
        loaded = true;
        panel.innerHTML = '';
        const txt = document.createElement('div');
        txt.className = 'prompt-text';
        txt.textContent = p.prompt || '(empty prompt in the sidecar)';
        panel.appendChild(txt);
        if (p.negative_prompt) {
          const neg = document.createElement('div');
          neg.className = 'prompt-meta';
          neg.textContent = 'negative: ' + p.negative_prompt;
          panel.appendChild(neg);
        }
        const bits = [];
        const seed = p.seed_used ?? p.seed;
        if (seed != null) bits.push('seed ' + seed);
        if (p.frames) bits.push(p.frames + 'f');
        if (p.width && p.height) bits.push(p.width + '×' + p.height);
        if (p.quality) bits.push(p.quality);
        if (bits.length) {
          const m = document.createElement('div');
          m.className = 'prompt-meta';
          m.textContent = bits.join(' · ');
          panel.appendChild(m);
        }
        const cp = document.createElement('button');
        cp.className = 'prompt-copy';
        cp.textContent = '⧉ copy the prompt';
        cp.addEventListener('click', () => copyText(p.prompt || '', cp));
        panel.appendChild(cp);
      } catch (e) {
        panel.textContent = '✗ prompt unavailable: ' + e.message;
      }
    });
    wrap.appendChild(tgl);
    wrap.appendChild(panel);
    body.appendChild(wrap);
  }

  // ---------- Extend -> Sequence tab (postMessage to the parent when in an iframe) ----------
  function sendToLtxExtend(o) {
    const payload = { type: 'ltx-extend', path: o.path || '', name: o.name || '', url: o.url || '' };
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(payload, '*');
    } else {
      copyText(o.path || (base() + o.url), null);
      alert('Path copied. Open the dashboard\'s Sequence tab and paste it as the extend source.');
    }
  }

  // ---------- Caption LoRA (3 frames → vision LLM) ----------
  async function captionVideo(o, btn, body) {
    let box = body.querySelector('.cap-result');
    if (!box) { box = document.createElement('div'); box.className = 'cap-result'; body.appendChild(box); }
    box.classList.add('show');
    box.textContent = '📝 extraction de 3 frames + vision…';
    const old = btn.textContent; btn.disabled = true; btn.textContent = '📝 …';
    try {
      const r = await fetch(base() + '/caption-video', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
        body: JSON.stringify({ path: o.path }),
      });
      const d = await r.json().catch(() => null);
      if (!d) throw new Error('non-JSON response (HTTP ' + r.status + ') — proxy v19+?');
      if (!r.ok || !d.caption) throw new Error(d.error || ('HTTP ' + r.status));
      box.innerHTML = '';
      const t = document.createElement('div'); t.textContent = d.caption; box.appendChild(t);
      const cp = document.createElement('button'); cp.className = 'prompt-copy cap-copy';
      cp.textContent = '⧉ copy the caption'; cp.addEventListener('click', () => copyText(d.caption, cp));
      box.appendChild(cp);
    } catch (e) {
      box.textContent = '✗ ' + e.message;
    } finally { btn.disabled=false;btn.removeAttribute('aria-busy'); btn.textContent = old; }
  }

  // ---------- Metadata badges (lazy, via IntersectionObserver) ----------
  const badgeObserver = ('IntersectionObserver' in window) ? new IntersectionObserver((entries, obs) => {
    entries.forEach(async en => {
      if (!en.isIntersecting) return;
      obs.unobserve(en.target);
      const facts = en.target, o = factsEntry.get(facts);
      if (!o || !o.path) return;
      try {
        const p = await fetchSidecar(o.path);
        const add = (txt, cls) => { const s = document.createElement('span'); s.className = 'mbadge' + (cls ? ' ' + cls : ''); s.textContent = txt; facts.appendChild(s); };
        if (p.mode && p.mode !== 't2v') add(p.mode);
        if (p.width && p.height) add(p.width + '×' + p.height);
        if (p.frames) add(p.frames + 'f');
        if (p.loras) add('LoRA', 'lora');
      } catch (_) { /* sidecar best-effort */ }
    });
  }, { rootMargin: '120px' }) : null;
  const factsEntry = new WeakMap();
  function observeBadges(facts, o) {
    if (!badgeObserver || !o.path) return;
    factsEntry.set(facts, o);
    badgeObserver.observe(facts);
  }

  // ---------- Side-by-side A/B comparison ----------
  let cmpSel = [];
  function toggleCompare(o, btn) {
    const id = o.path || o.url;
    const idx = cmpSel.findIndex(x => (x.path || x.url) === id);
    if (idx >= 0) { cmpSel.splice(idx, 1); btn.classList.remove('cmp-on'); }
    else {
      if (cmpSel.length >= 2) { alert('At most 2 videos in a comparison. Remove one first.'); return; }
      cmpSel.push(o); btn.classList.add('cmp-on');
    }
    renderCmpBar();
  }
  function renderCmpBar() {
    const bar = document.getElementById('cmpbar');
    document.getElementById('cmpSlot0').textContent = cmpSel[0] ? cmpSel[0].name : '—';
    document.getElementById('cmpSlot1').textContent = cmpSel[1] ? cmpSel[1].name : '—';
    document.getElementById('cmpGo').disabled = cmpSel.length !== 2;
    bar.classList.toggle('show', cmpSel.length > 0);
  }
  async function openCompare() {
    if (cmpSel.length !== 2) return;
    const modal = document.getElementById('cmpmodal');
    modal.classList.add('show');
    for (let i = 0; i < 2; i++) {
      const v = document.getElementById('cmpV' + i);
      v.src = ''; v.poster = '';
      try {
        const r = await fetch(base() + cmpSel[i].url, { headers: { 'ngrok-skip-browser-warning': '1' } });
        v.src = URL.createObjectURL(await r.blob()); v.volume = GVOL;
      } catch (e) { /* ignore */ }
    }
  }
  document.getElementById('cmpGo').addEventListener('click', openCompare);
  document.getElementById('cmpClear').addEventListener('click', () => {
    cmpSel = []; document.querySelectorAll('.actions button.cmp-on').forEach(b => b.classList.remove('cmp-on')); renderCmpBar();
  });
  document.getElementById('cmpClose').addEventListener('click', () => {
    document.getElementById('cmpmodal').classList.remove('show');
    ['cmpV0', 'cmpV1'].forEach(id => { const v = document.getElementById(id); v.pause(); });
  });
  document.getElementById('cmpSync').addEventListener('click', () => {
    ['cmpV0', 'cmpV1'].forEach(id => { const v = document.getElementById(id); v.currentTime = 0; v.play(); });
  });

  // ---------- video: fetch -> blob -> objectURL ----------
  async function loadVideoBlob(holder, url) {
    holder.innerHTML = '';
    const prog = document.createElement('div');
    prog.className = 'loadvid loadvid-progress';
    prog.textContent = '⏳ loading…';
    holder.appendChild(prog);
    try {
      const r = await fetch(url, { headers: { 'ngrok-skip-browser-warning': '1' } });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);

      // Streamed read so progress can be shown when Content-Length is known.
      const total = +(r.headers.get('Content-Length') || 0);
      let received = 0;
      const reader = r.body && r.body.getReader ? r.body.getReader() : null;
      let blob;
      if (reader) {
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          prog.textContent = total
            ? `⏳ ${(received / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} Mo`
            : `⏳ ${(received / 1048576).toFixed(1)} Mo`;
        }
        blob = new Blob(chunks, { type: r.headers.get('Content-Type') || 'video/mp4' });
      } else {
        blob = await r.blob();
      }

      const obj = URL.createObjectURL(blob);
      const v = document.createElement('video');
      v.controls = true;
      v.autoplay = true;
      v.volume = GVOL;   // avoids a blast of sound when a clip starts
      v.src = obj;
      holder.innerHTML = '';
      holder.appendChild(v);
    } catch (e) {
      holder.innerHTML = '';
      const err = document.createElement('div');
      err.className = 'vid-err';
      err.textContent = '✗ ' + e.message;
      holder.appendChild(err);
      const retry = document.createElement('button');
      retry.className = 'loadvid';
      retry.textContent = '↻ retry';
      retry.addEventListener('click', () => loadVideoBlob(holder, url));
      holder.appendChild(retry);
    }
  }

  // ---------- render ----------
  function fmtSize(mb) { return mb >= 1 ? mb.toFixed(1) + ' Mo' : (mb * 1024).toFixed(0) + ' Ko'; }
  function fmtElapsed(s) {
    if (!s && s !== 0) return '';
    if (s < 60) return s.toFixed(0) + 's';
    return Math.floor(s / 60) + 'm' + String(Math.round(s % 60)).padStart(2, '0');
  }

  function render() {
    const items = lastOutputs.filter(o => filter === 'all' ? true : o.kind === filter);
    els.grid.innerHTML = '';
    els.empty.style.display = items.length ? 'none' : 'block';

    for (const o of items) {
      const url = publicURL(o);
      const card = document.createElement('div');
      card.className = 'card';

      if (o.kind === 'video') {
        // Playback via fetch->blob: the clip is downloaded into memory and
        // played from a local objectURL. This sidesteps the native <video>
        // Range requests that Safari refuses through the tunnel ("network lost").
        const holder = document.createElement('div');
        holder.className = 'media-holder';
        if (o.path) {  // first-frame preview (black tile -> poster) without loading the clip
          const poster = document.createElement('img');
          poster.className = 'poster';
          poster.loading = 'lazy';
          poster.alt = '';
          poster.src = `${base()}/thumb?path=${encodeURIComponent(o.path)}`;
          // if /thumb fails (proxy not restarted, ffmpeg missing…) fall back to the black tile
          poster.addEventListener('error', () => poster.remove());
          holder.appendChild(poster);
        }
        const loadBtn = document.createElement('button');
        loadBtn.className = 'loadvid';
        loadBtn.textContent = `▶ Load & play (${fmtSize(o.size_mb)})`;
        loadBtn.addEventListener('click', () => loadVideoBlob(holder, url));
        holder.appendChild(loadBtn);
        card.appendChild(holder);
      } else {
        const media = document.createElement('img');
        media.loading = 'lazy';
        media.src = url;
        card.appendChild(media);
      }

      const body = document.createElement('div');
      body.className = 'body';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = o.name;
      body.appendChild(name);

      const facts = document.createElement('div');
      facts.className = 'facts';
      const parts = [o.mtime, fmtSize(o.size_mb)];
      if (o.elapsed_sec) parts.push('⏱ ' + fmtElapsed(o.elapsed_sec));
      facts.innerHTML = parts.map(p => `<span>${p}</span>`).join('') +
        (o.kind === 'video' ? '<span class="badge">mp4</span>' : '<span class="badge">img</span>');
      body.appendChild(facts);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const copyBtn = document.createElement('button');
      copyBtn.textContent = '🔗 copy the link';
      copyBtn.addEventListener('click', () => copyText(url, copyBtn));
      actions.appendChild(copyBtn);

      const openA = document.createElement('a');
      openA.textContent = '↗ open';
      openA.href = url; openA.target = '_blank'; openA.rel = 'noopener';
      actions.appendChild(openA);

      const dlA = document.createElement('a');
      dlA.textContent = '↓ download';
      dlA.href = url; dlA.download = o.name;
      actions.appendChild(dlA);

      if (o.kind === 'video') {
        const extBtn = document.createElement('button');
        extBtn.textContent = '⏩ extend';
        extBtn.title = 'Send this video to the Sequence tab (extend mode)';
        extBtn.addEventListener('click', () => sendToLtxExtend(o));
        actions.appendChild(extBtn);

        const capBtn = document.createElement('button');
        capBtn.textContent = '📝 caption';
        capBtn.title = 'Generate a LoRA caption (3 frames → vision LLM)';
        capBtn.addEventListener('click', () => captionVideo(o, capBtn, body));
        actions.appendChild(capBtn);

        const cmpBtn = document.createElement('button');
        cmpBtn.textContent = '⚖ A/B';
        cmpBtn.title = 'Add to the side-by-side comparison (max 2)';
        cmpBtn.dataset.cmp = o.path || o.url;
        cmpBtn.addEventListener('click', () => toggleCompare(o, cmpBtn));
        if (cmpSel.find(x => (x.path || x.url) === (o.path || o.url))) cmpBtn.classList.add('cmp-on');
        actions.appendChild(cmpBtn);
      }

      body.appendChild(actions);
      if (o.has_sidecar) { attachPromptPanel(body, o); observeBadges(facts, o); }
      card.appendChild(body);
      els.grid.appendChild(card);
    }
  }

  // ---------- fetch ----------
  async function load() {
    clearStatus();
    setStatus('Loading /outputs…', 'wait');
    try {
      const r = await fetch(base() + '/outputs?include_hidden=0&limit=10000', {
        headers: { 'ngrok-skip-browser-warning': '1' },
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      lastOutputs = data.outputs || [];
      // Merge in the DrawThings images (/img-list route) — otherwise the
      // "Images" filter stays empty: /outputs only returns MLX videos.
      try {
        const ir = await fetch(base() + '/img-list', { headers: { 'ngrok-skip-browser-warning': '1' } });
        if (ir.ok) {
          const idata = await ir.json();
          const imgs = (idata.extended || idata.images || []).map(im => ({
            kind: 'image',
            name: im.name,
            url: im.url,
            mtime: im.mtime ? new Date(im.mtime * 1000).toLocaleString() : '',
            size_mb: im.size ? im.size / 1048576 : undefined,
          }));
          lastOutputs = lastOutputs.concat(imgs);
        }
      } catch (_) { /* images best-effort */ }
      const nv = lastOutputs.filter(o => o.kind === 'video').length;
      const ni = lastOutputs.filter(o => o.kind === 'image').length;
      els.meta.textContent = `${data.total ?? lastOutputs.length} items · ${nv} videos · ${ni} images · updated ${new Date().toLocaleTimeString()}`;
      clearStatus();
      render();
    } catch (e) {
      setStatus(
        `✗ Could not load /outputs: ${e.message}\n\n` +
        `Check that the CORS proxy is running and that ngrok points at it. ` +
        `Test direct : ${base()}/outputs`,
        'err'
      );
    }
  }

  els.refresh.addEventListener('click', load);
  els.endpoint.addEventListener('change', load);

  let autoTimer = null;
  els.autorefresh.addEventListener('change', () => {
    if (els.autorefresh.checked) {
      autoTimer = setInterval(load, 30000);
    } else if (autoTimer) {
      clearInterval(autoTimer); autoTimer = null;
    }
  });

  // ---------- Live monitor: running job + queue (GET /status) ----------
  function fmtClock(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    return m > 0 ? `${m}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`;
  }
  function jobLabel(j) {
    const p = j.params || {};
    return p.label || (p.prompt ? p.prompt.slice(0, 70) + (p.prompt.length > 70 ? '…' : '') : (j.id || 'job'));
  }

  // server-reported elapsed time + client clock, for a smooth display
  let monBaseElapsed = 0;   // secondes (serveur)
  let monBaseAt = 0;        // performance.now() at fetch time
  let monRunning = false;
  let monPrevRunning = false;

  function paintMonitor(data) {
    const cur = data.current;
    const queue = data.queue || [];
    monRunning = !!cur;

    // when a job has just finished -> refresh the gallery
    if (monPrevRunning && !monRunning) load();
    monPrevRunning = monRunning;

    if (!cur && queue.length === 0) {
      els.monitor.className = 'monitor';   // hidden
      els.monitor.innerHTML = '';
      return;
    }
    els.monitor.className = 'monitor show';

    let html = '<div class="mon-card">';
    if (cur) {
      const prog = cur.progress || {};
      monBaseElapsed = prog.elapsed_sec || 0;
      monBaseAt = performance.now();
      const pct = typeof prog.pct === 'number' ? Math.max(0, Math.min(100, prog.pct)) : null;
      const eta = prog.eta_sec ? ` · ETA ~${fmtClock(prog.eta_sec)}` : '';
      html += `
        <div class="mon-row">
          <span class="mon-live"></span>
          <span class="mon-title">Running</span>
          <span class="mon-name">${jobLabel(cur)}</span>
          <span class="mon-time" id="monTime">${fmtClock(monBaseElapsed)}</span>
          <button class="mon-cancel stop" data-stop="1" title="Stop the running render">⏹ Stop</button>
        </div>
        <div class="mon-phase">${(prog.phase_label || cur.status || 'rendu…')}${pct !== null ? ` · ${pct.toFixed(0)}%` : ''}${eta}</div>
        <div class="mon-bar"><i style="width:${pct !== null ? pct : 0}%"></i></div>`;
    } else {
      html += '<div class="mon-idle">Worker idle — queue:</div>';
    }
    if (queue.length) {
      html += `<div class="mon-queue"><span class="qhead">Queue: ${queue.length} waiting</span>`;
      if (queue.length > 1) html += ` <button class="mon-cancel" data-clear="1" title="Clear the whole queue">clear the queue</button>`;
      html += '<ol>';
      html += queue.slice(0, 12).map(j =>
        `<li><span class="qname">${jobLabel(j)}</span>` +
        `<button class="mon-cancel" data-cancel="${j.id}" title="Cancel this clip">✕</button></li>`
      ).join('');
      if (queue.length > 12) html += `<li>… +${queue.length - 12}</li>`;
      html += '</ol></div>';
    }
    html += '</div>';
    els.monitor.innerHTML = html;
  }

  // ---------- cancellation: queue actions (event delegation) ----------
  async function postForm(path, fields) {
    const body = new URLSearchParams(fields || {});
    const r = await fetch(base() + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'ngrok-skip-browser-warning': '1' },
      body,
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json().catch(() => ({}));
  }
  els.monitor.addEventListener('click', async (e) => {
    const cancel = e.target.closest('[data-cancel]');
    const stop = e.target.closest('[data-stop]');
    const clear = e.target.closest('[data-clear]');
    try {
      if (cancel) {
        e.target.disabled = true; e.target.textContent = '…';
        await postForm('/queue/remove', { id: cancel.dataset.cancel });
      } else if (clear) {
        if (!confirm('Clear the whole queue?')) return;
        await postForm('/queue/clear', {});
      } else if (stop) {
        if (!confirm('Stop the running render?')) return;
        await postForm('/stop', {});
      } else return;
      pollStatus();
    } catch (err) {
      setStatus('✗ Queue action failed: ' + err.message, 'err');
    }
  });

  async function pollStatus() {
    try {
      const r = await fetch(base() + '/status', { headers: { 'ngrok-skip-browser-warning': '1' } });
      if (!r.ok) return;
      paintMonitor(await r.json());
    } catch (_) { /* silent: the monitor retries on the next tick */ }
  }

  // client ticker: advances the stopwatch between two server polls
  setInterval(() => {
    if (!monRunning) return;
    const el = document.getElementById('monTime');
    if (el) el.textContent = fmtClock(monBaseElapsed + (performance.now() - monBaseAt) / 1000);
  }, 1000);
  // Adaptive /status polling: during a render the requests are spaced out (the
  // stopwatch stays smooth via the 1s client ticker, no network) so as not to
  // load the machine busy with LTX; when idle we poll more often to react fast.
  let statusTimer = null;
  function scheduleStatus() {
    const delay = monRunning ? 12000 : 4000;
    statusTimer = setTimeout(async () => { await pollStatus(); scheduleStatus(); }, delay);
  }

  load();
  pollStatus().then(scheduleStatus);
</script>

<!-- Health lights (proxy/ngrok · Phosphene · Ollama) -->
<div id="healthbar"></div>
<script>
(function(){
  const bar=document.getElementById('healthbar');
  bar.style.cssText="position:fixed;top:8px;right:10px;z-index:60;display:flex;gap:8px;align-items:center;font:10px/1 monospace;background:rgba(5,0,16,.72);border:1px solid rgba(255,0,170,.35);border-radius:9px;padding:4px 8px;backdrop-filter:blur(8px);color:#f0e8ff;";
  const ep=document.getElementById('endpoint');
  const defs=[['proxy/ngrok','proxy'],['Phosphene','phosphene'],['Ollama','ollama']];
  function b(){return (ep&&ep.value||'').replace(/\/+$/,'');}
  function dot(c){return `<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};box-shadow:0 0 6px ${c};margin-right:4px;"></i>`;}
  function render(s){
    bar.innerHTML=defs.map(([l,k])=>{const v=s[k];const c=v===true?'#00ff9d':v===false?'#ff5050':'#777';return `<span title="${l}">${dot(c)}${l}</span>`;}).join('')
      +(s.model?`<span style="opacity:.6;" title="modele LLM">· ${s.model}${s.model_available===false?' ⚠':''}</span>`:'');
  }
  async function poll(){
    if(!b()){render({});return;}
    try{const r=await fetch(b()+'/health',{headers:{'ngrok-skip-browser-warning':'1'}});if(!r.ok)throw 0;const d=await r.json();
      render({proxy:true,phosphene:d.phosphene,ollama:d.ollama,model:d.model,model_available:d.model_available});}
    catch(_){render({proxy:false,phosphene:null,ollama:null});}
  }
  setInterval(poll,10000);poll();
})();
</script>
